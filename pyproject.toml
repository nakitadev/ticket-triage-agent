[project]
name = "support-ticket-triage-agent"
version = "1.0.0"
description = "Support Ticket Triage AI Agent built with OpenAI Agents SDK and Pydantic v2"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "httpx>=0.27.0",
    "openai>=1.60.0",
    "openai-agents>=0.0.3",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "rich>=13.0.0",
    "uvicorn>=0.27.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
