name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  test:
    name: Pytest Suite (Python 3.12)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify file line-count limit (< 150 lines)
        run: |
          python -c "
          import pathlib, sys
          files = ['main.py', 'api.py', * sorted(str(p) for p in pathlib.Path('src').glob('*.py')), *sorted(str(p) for p in pathlib.Path('tests').glob('*.py'))]
          failed = False
          for f in files:
              lines = len(pathlib.Path(f).read_text(encoding='utf-8').splitlines())
              print(f'{f}: {lines} lines')
              if lines >= 150:
                  failed = True
          sys.exit(1 if failed else 0)
          "

      - name: Run unit & contract test suite
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: pytest -v
