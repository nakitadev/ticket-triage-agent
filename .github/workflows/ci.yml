name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  test:
    name: Pytest Suite (uv + Python 3.12)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python 3.12 and sync dependencies
        run: |
          uv python install 3.12
          uv sync --locked

      - name: Verify file line-count limit (< 150 lines)
        run: |
          uv run python -c "
          import pathlib, sys
          files = ['main.py', 'api.py', *sorted(str(p) for p in pathlib.Path('src').glob('*.py')), *sorted(str(p) for p in pathlib.Path('tests').glob('*.py'))]
          failed = False
          for f in files:
              lines = len(pathlib.Path(f).read_text(encoding='utf-8').splitlines())
              print(f'{f}: {lines} lines')
              if lines >= 150:
                  failed = True
          sys.exit(1 if failed else 0)
          "

      - name: Run unit & contract test suite
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: uv run pytest -v
